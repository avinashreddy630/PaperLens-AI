services:
  # ── PaperLens AI Backend API ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql+asyncpg://postgres:postgres@postgres:5432/paperlens_ai
      - POSTGRES_DB_NAME=paperlens_ai
      - USE_QDRANT=true
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please-set-a-strong-random-secret-in-production-min-32-chars}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/chroma_db:/app/backend/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=paperlens_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperlens_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Store ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
